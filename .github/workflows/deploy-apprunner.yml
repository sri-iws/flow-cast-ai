name: Deploy to AWS App Runner

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: flow-cast-ai
  APP_RUNNER_SERVICE_NAME: flow-cast-ai
  IMAGE_TAG: ${{ github.sha }}
  GHCR_IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/flow-cast-ai

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::811364788460:role/GitHubActionsAppRunnerRole
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" >/dev/null 2>&1 || \
          aws ecr create-repository \
            --repository-name "$ECR_REPOSITORY" \
            --region "$AWS_REGION"

      - name: Build and push image to ECR and GHCR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            -t "$GHCR_IMAGE_REPO:$IMAGE_TAG" \
            -t "$GHCR_IMAGE_REPO:latest" \
            .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$GHCR_IMAGE_REPO:$IMAGE_TAG"
          docker push "$GHCR_IMAGE_REPO:latest"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Create or update App Runner service
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          SOURCE_CONFIG_JSON=$(cat <<EOF
          {
            "ImageRepository": {
              "ImageIdentifier": "$IMAGE_URI",
              "ImageRepositoryType": "ECR",
              "ImageConfiguration": {
                "Port": "8000"
              }
            }
          }
          EOF
          )

          SERVICE_ARN=$(aws apprunner list-services \
            --region "$AWS_REGION" \
            --query "ServiceSummaryList[?ServiceName=='$APP_RUNNER_SERVICE_NAME'] | [0].ServiceArn" \
            --output text)

          if [ "$SERVICE_ARN" = "None" ] || [ -z "$SERVICE_ARN" ]; then
            aws apprunner create-service \
              --service-name "$APP_RUNNER_SERVICE_NAME" \
              --source-configuration "$SOURCE_CONFIG_JSON" \
              --instance-configuration '{"Cpu":"1024","Memory":"2048"}' \
              --region "$AWS_REGION"
          else
            aws apprunner update-service \
              --service-arn "$SERVICE_ARN" \
              --source-configuration "$SOURCE_CONFIG_JSON" \
              --instance-configuration '{"Cpu":"1024","Memory":"2048"}' \
              --region "$AWS_REGION"
          fi

      - name: Show App Runner URL
        run: |
          aws apprunner describe-service \
            --service-name "$APP_RUNNER_SERVICE_NAME" \
            --region "$AWS_REGION" \
            --query "Service.StatusUrl" \
            --output text
