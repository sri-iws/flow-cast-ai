$ACCOUNT_ID = "811364788460"
$REGION = "us-east-1"
$ROLE_NAME = "GitHubActions-AppRunner-Deploy"

@'
{
  "Version": "2012-10-17",
  "Statement": [
    {
      "Effect": "Allow",
      "Principal": {
        "Federated": "arn:aws:iam::' + $ACCOUNT_ID + ':oidc-provider/token.actions.githubusercontent.com"
      },
      "Action": "sts:AssumeRoleWithWebIdentity",
      "Condition": {
        "StringEquals": {
          "token.actions.githubusercontent.com:aud": "sts.amazonaws.com",
          "token.actions.githubusercontent.com:sub": "repo:sri-iws/flow-cast-ai:ref:refs/heads/main"
        }
      }
    }
  ]
}
'@ | Out-File trust-policy.json -Encoding utf8

@'
{
  "Version": "2012-10-17",
  "Statement": [
    {
      "Sid": "ECRPushAccess",
      "Effect": "Allow",
      "Action": [
        "ecr:GetAuthorizationToken",
        "ecr:BatchCheckLayerAvailability",
        "ecr:CompleteLayerUpload",
        "ecr:InitiateLayerUpload",
        "ecr:PutImage",
        "ecr:UploadLayerPart"
      ],
      "Resource": "*"
    },
    {
      "Sid": "AppRunnerManageService",
      "Effect": "Allow",
      "Action": [
        "apprunner:CreateService",
        "apprunner:UpdateService",
        "apprunner:DescribeService",
        "apprunner:ListServices"
      ],
      "Resource": "*"
    }
  ]
}
'@ | Out-File apprunner-deploy-policy.json -Encoding utf8

aws iam create-role `
  --role-name $ROLE_NAME `
  --assume-role-policy-document file://trust-policy.json

aws iam put-role-policy `
  --role-name $ROLE_NAME `
  --policy-name AppRunnerDeployPolicy `
  --policy-document file://apprunner-deploy-policy.json

aws iam get-role `
  --role-name $ROLE_NAME `
  --query "Role.Arn" `
  --output text
